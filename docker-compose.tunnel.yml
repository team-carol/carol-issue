services:
  carol-issue:
    image: ghcr.io/team-carol/carol-issue:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: ${PORT:-3000}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:' + (process.env.PORT || 3000) + '/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - tunnel

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN}
    depends_on:
      carol-issue:
        condition: service_healthy
    networks:
      - tunnel

networks:
  tunnel:
    driver: bridge
